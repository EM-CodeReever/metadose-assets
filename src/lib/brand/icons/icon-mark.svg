<svg width="36" height="36" viewBox="-2 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="metadose icon">
  <title>metadose icon mark</title>
  <!--
    metadose — Icon mark only (square, scalable)
    Use at sizes where the wordmark would be too small to read (<80px wide).
    This file scales cleanly from 16px favicon to 512px app icon.
    For favicon use: embed in <link rel="icon"> as SVG, or rasterise to .ico
  -->

  <!-- Back layer -->
  <rect x="0" y="10" width="24" height="24" rx="6" fill="#D1DEFF"/>
  <!-- Mid layer -->
  <rect x="4" y="6"  width="24" height="24" rx="6" fill="#8EB4FF"/>
  <!-- Front layer -->
  <rect x="8" y="2"  width="24" height="24" rx="6" fill="#1E6BFF"/>

  <!-- Asset list lines -->
  <rect x="13" y="8"  width="13" height="2" rx="1" fill="white" opacity="0.9"/>
  <rect x="13" y="13" width="9"  height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="13" y="18" width="11" height="2" rx="1" fill="white" opacity="0.5"/>

  <!-- Row dots -->
  <circle cx="10" cy="9"  r="1.4" fill="white" opacity="0.9"/>
  <circle cx="10" cy="14" r="1.4" fill="white" opacity="0.7"/>
  <circle cx="10" cy="19" r="1.4" fill="white" opacity="0.5"/>
</svg>
